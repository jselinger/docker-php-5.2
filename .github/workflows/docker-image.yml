name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Triggers the build when you push to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the Git repository code
    - name: Check out the repo
      uses: actions/checkout@v4

    # 2. Log in to Docker Hub (or another container registry)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Build the Docker image and push it to the registry
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/php-5.2:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/php-5.2:${{ github.sha }}